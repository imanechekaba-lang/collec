<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collec">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%238b3dff'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial Black'>C</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%238b3dff'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial Black'>C</text></svg>">
<title>Collec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Bebas+Neue&family=Caveat:wght@500;700&family=Permanent+Marker&family=Special+Elite&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#000;--s1:#0f0a17;--s2:#1a1226;--s3:#251a36;--line:#2d2142;
  --tx:#f4effa;--mu:#a597b9;--vi:#8b3dff;--vi2:#bf94ff;--pk:#ff5fc1;--ok:#5fe0a8;
  --disp:"Syne","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--tx:#f4effa}}
:root[data-theme="dark"]{--bg:#000;--tx:#f4effa}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(0,0,0,.82);backdrop-filter:blur(14px)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--vi2);outline-offset:2px;border-radius:6px}
img{max-width:100%}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.01em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
.logo{font:800 24px/1 var(--disp);letter-spacing:-.03em;background:linear-gradient(100deg,#fff 20%,var(--vi2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;max-width:520px}
.search input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:10px 16px;outline:none}
.search input:focus{border-color:var(--vi)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{padding:8px 14px;border-radius:999px;color:var(--mu);font-weight:600}
.tabs a.on{background:var(--s3);color:var(--tx)}
.bottom{display:none}
@media (max-width:820px){
  .tabs{display:none}
  .top-in{padding:10px 14px;gap:12px}
  .logo{font-size:21px}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 0}
  .bottom a span{font-size:19px;line-height:1}
  .bottom a.on{color:var(--vi2)}
}

main{max-width:1320px;margin:0 auto;padding:0 20px 40px}
@media (max-width:820px){main{padding:0 14px 30px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--vi);color:#fff;font-weight:700;padding:11px 20px;border-radius:999px;transition:background .15s}
.btn:hover{background:#9b57ff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.ghost:hover{border-color:var(--vi2)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.danger{background:transparent;border:1px solid #5a2440;color:#ff8fb5}
.link{color:var(--vi2);font-weight:700;text-decoration:underline}

/* hero */
.hero{padding:44px 0 28px;position:relative}
.hero h1{font-size:clamp(34px,6.4vw,76px);font-weight:800;line-height:.95;letter-spacing:-.04em;max-width:13ch}
.hero p{color:var(--mu);margin:16px 0 22px;max-width:46ch}
.hero-act{display:flex;gap:10px;flex-wrap:wrap}
.hero::after{content:"";position:absolute;right:-8%;top:-40px;width:min(520px,70vw);aspect-ratio:1;background:radial-gradient(circle,rgba(139,61,255,.35),transparent 65%);pointer-events:none;z-index:-1}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:5;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mu);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx)}
.chips.static{position:static}

h2.sec{font-size:30px;font-weight:800;margin:34px 0 4px;letter-spacing:-.03em}

/* rows */
.row{margin:18px 0 6px}
.row-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.row-h h3{font-size:18px;font-weight:700}
.row-h small{color:var(--mu)}
.arrows{margin-left:auto;display:flex;gap:6px}
.arr{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:20px;line-height:1;color:var(--mu)}
.arr:hover{color:var(--tx);border-color:var(--vi2)}
@media (hover:none){.arrows{display:none}}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.card{flex:none;width:142px;text-align:left;scroll-snap-align:start;position:relative;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
@media (max-width:820px){.card{width:118px}}
.card-t{display:block;margin-top:7px;font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-s{display:block;color:var(--mu);font-size:12.5px;margin-top:1px}
.card:active .cov{transform:scale(.97)}
.card .cov{transition:transform .15s}
.badge{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--pk);color:#fff;font-style:normal;font-size:13px;display:grid;place-items:center}
.badge.done{background:var(--ok);color:#000}
.rank{position:absolute;left:-4px;bottom:46px;font:800 64px/1 var(--disp);color:#000;-webkit-text-stroke:2px var(--vi2);letter-spacing:-.06em;pointer-events:none}
.ranked .card{margin-left:22px}

/* generated covers */
.cov{aspect-ratio:2/3;width:100%;border-radius:10px;position:relative;overflow:hidden;background:var(--s2) center/cover no-repeat;container-type:inline-size;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.cov.gen{background:linear-gradient(165deg,hsl(var(--h) 78% 36%) 0%,hsl(calc(var(--h) + 34) 70% 14%) 62%,#05010a 100%)}
.cov.gen.v1{background:linear-gradient(200deg,hsl(var(--h) 85% 58%) 0%,hsl(var(--h) 70% 22%) 45%,#07020d 100%)}
.cov.gen.v2{background:radial-gradient(120% 70% at 20% 0%,hsl(calc(var(--h) - 20) 90% 55%),transparent 60%),linear-gradient(180deg,hsl(var(--h) 60% 16%),#030008)}
.cov-l{position:absolute;right:-6cqi;bottom:-18cqi;font:800 92cqi/1 var(--disp);color:rgba(255,255,255,.12);letter-spacing:-.06em}
.cov.v1 .cov-l{right:auto;left:-4cqi;top:-14cqi;bottom:auto}
.cov-t{position:absolute;left:8cqi;right:8cqi;bottom:9cqi;font:800 12.5cqi/1.02 var(--disp);letter-spacing:-.02em;color:#fff;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.cov.v1 .cov-t{top:auto;bottom:9cqi}
.cov.v2 .cov-t{top:30cqi;bottom:auto}
.cov-c{position:absolute;left:8cqi;top:7cqi;right:8cqi;font:600 7.4cqi/1.2 var(--body);color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cov.v2 .cov-c{top:auto;bottom:8cqi}

/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px;margin:10px 0 20px}
.grid .card{width:auto}
@media (max-width:820px){.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}}

.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:30px 0 14px}
.page-h h1{font-size:clamp(28px,4.4vw,46px);font-weight:800;letter-spacing:-.03em;margin-right:auto}
.fine{color:var(--mu);font-size:13px}
.loading{color:var(--vi2);font-weight:600;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--mu)}

/* folders */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.ftile{display:flex;flex-direction:column;gap:4px;text-align:left}
.ftile b{font-weight:700;margin-top:6px}
.ftile span{color:var(--mu);font-size:13px}
.ftile.new .fcov{display:grid;place-items:center;border:1.5px dashed var(--line);background:transparent;font:300 54px/1 var(--body);color:var(--vi2)}
.fcov{aspect-ratio:4/3;border-radius:14px;overflow:hidden;position:relative;background:var(--s2) center/cover no-repeat}
.fcov.p{display:grid;place-items:center;font-size:44px}
.fcov.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px}
.fcov.mosaic .cov{aspect-ratio:auto;height:100%;border-radius:0}
.fcov.mosaic .cov-t{font-size:16cqi}
.fcov.mosaic .cov-c,.fcov.mosaic .cov-l{display:none}
.p0{background:linear-gradient(135deg,#3b0f8c,#0d0420)}.p1{background:linear-gradient(135deg,#7a1c8f,#14031a)}
.p2{background:linear-gradient(135deg,#1e2a8f,#05061a)}.p3{background:linear-gradient(135deg,#b0217a,#200518)}
.p4{background:linear-gradient(135deg,#4a1fb8,#ff5fc1 160%)}.p5{background:linear-gradient(135deg,#0f4c6e,#030b14)}
.p6{background:linear-gradient(135deg,#8b3dff,#1a0638)}.p7{background:linear-gradient(135deg,#2a2a2a,#000)}

.fhead{display:flex;gap:20px;align-items:flex-end;padding:30px 0 16px;flex-wrap:wrap}
.fhead .fcov{width:180px;flex:none}
.fhead h1{font-size:clamp(28px,4.4vw,46px);font-weight:800;letter-spacing:-.03em}
.fhead p{color:var(--mu);margin:6px 0 12px;max-width:52ch}
.fhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.tools .chips{position:static;padding:0}
select{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lpos{width:22px;text-align:right;color:var(--mu);font:700 14px var(--disp)}
.lchk{width:28px;height:28px;flex:none;border-radius:8px;border:1.5px solid var(--line);color:transparent;font-weight:800}
.lchk.on{background:var(--ok);border-color:var(--ok);color:#000}
.lmain{flex:1;display:flex;gap:12px;align-items:center;min-width:0}
.lmain .cov{width:46px;flex:none;border-radius:6px}
.lmain .cov-c,.lmain .cov-l{display:none}
.lmain .cov-t{font-size:15cqi}
.lmain div{min-width:0}
.lmain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmain span{display:block;color:var(--mu);font-size:13px}
.lmain .st{color:var(--vi2)}
.ministars{color:#ffd166;font-size:13px;letter-spacing:1px;white-space:nowrap}
.lmove{display:flex;flex-direction:column}
.lmove button,.lx{color:var(--mu);padding:2px 8px;font-size:16px}
.lmove button:hover,.lx:hover{color:var(--tx)}

/* fiche */
.fiche{display:grid;grid-template-columns:300px 1fr;gap:36px;padding:30px 0}
@media (max-width:820px){.fiche{grid-template-columns:1fr;gap:22px;padding-top:18px}}
.fiche-side .cov{max-width:260px}
@media (max-width:820px){.fiche-top{display:flex;gap:16px;align-items:flex-end}.fiche-side .cov{width:130px;flex:none}}
.fiche h1{font-size:clamp(26px,3.6vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin-top:16px}
@media (max-width:820px){.fiche h1{margin-top:0}}
.meta{color:var(--mu);margin:6px 0 0}
.covbtn{display:inline-block;margin-top:10px;color:var(--vi2);font-weight:600;font-size:13px;cursor:pointer}
.infos{margin-top:20px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.infos .resume{margin:0 0 12px;line-height:1.6}
.infos dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.infos dt{color:var(--mu)}
.infos dd{margin:0}
.fsec{margin-bottom:22px}
.fsec>h3{font:700 13px var(--body);color:var(--mu);margin:0 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:9px 15px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px}
.seg button.on{background:var(--vi);border-color:var(--vi);color:#fff}
.stars{display:flex;gap:4px}
.stars button{font-size:30px;line-height:1;color:var(--s3);transition:transform .1s}
.stars button.on{color:#ffd166}
.stars button:active{transform:scale(1.2)}
.fields{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
.field input,.inp,textarea{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);outline:none}
.field input:focus,.inp:focus,textarea:focus{border-color:var(--vi)}
.field input[type=number]{width:110px}
textarea{width:100%;resize:vertical;line-height:1.6}
.notes{min-height:220px;background:var(--s1) repeating-linear-gradient(transparent 0 31px,rgba(191,148,255,.08) 31px 32px);background-attachment:local;line-height:32px;padding-top:4px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600}
.tag button{width:20px;height:20px;border-radius:50%;color:var(--mu)}
.tagin{background:transparent;border:1px dashed var(--line);border-radius:999px;padding:6px 12px;outline:none;min-width:140px}
.quotes{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.quote{position:relative;border-left:3px solid var(--vi);padding:4px 34px 4px 14px;font-family:var(--disp);font-weight:600;font-size:16px;line-height:1.45}
.quote button{position:absolute;right:0;top:2px;color:var(--mu);padding:2px 8px}
.ftabs{display:flex;gap:6px;margin-bottom:10px}
.canvas-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#120c1c}
canvas#pad{display:block;width:100%;touch-action:none;cursor:crosshair}
.padbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
.dot.on{border-color:#fff}
.padbar .sp{flex:1}

/* panels & stats */
.panel{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}
.panel h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.panel>p{color:var(--mu);margin:6px 0 14px}
.reco p{font-size:12.5px;color:var(--mu);margin:4px 0 0;line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi b{display:block;font:800 38px/1 var(--disp);letter-spacing:-.03em}
.kpi span{color:var(--mu);font-size:13px}
.goal{height:14px;border-radius:999px;background:var(--s3);overflow:hidden;margin:12px 0 8px}
.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--pk));border-radius:999px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 32px;gap:10px;align-items:center;font-size:14px}
.bar div{height:10px;background:var(--s3);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--vi2);border-radius:999px}
.bar b{text-align:right}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:130px}
.months div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mu)}
.months i{width:100%;background:var(--vi);border-radius:6px 6px 2px 2px;min-height:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.66);backdrop-filter:blur(4px)}
#modal[hidden]{display:none}
.mbox{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:821px){#modal{align-items:center}.mbox{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mbox h2{font-size:22px;font-weight:800;margin-bottom:14px}
.shead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.shead .cov{width:56px;flex:none;border-radius:8px}
.shead .cov-c,.shead .cov-l{display:none}
.shead b{display:block;font:800 18px/1.15 var(--disp)}
.shead span{color:var(--mu);font-size:13px}
.sbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;font-weight:600}
.sbtn:hover{background:var(--s2)}
.sbtn em{font-style:normal;width:24px;text-align:center;font-size:18px}
.sbtn .on{margin-left:auto;color:var(--ok)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mu)}
.form .inp,.form select,.form textarea{border-radius:12px;padding:10px 12px;background:var(--s2)}
.covpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.covpick button,.covpick label{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:24px;border:2px solid transparent;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
.covpick .on{border-color:#fff}
.covpick .up{border:1.5px dashed var(--line);font-size:12px;color:var(--mu);text-align:center;line-height:1.2;padding:4px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pick{display:flex;gap:16px;align-items:center;margin:4px 0 14px}
.pick .cov{width:120px;flex:none}
.pick b{display:block;font:800 26px/1.05 var(--disp);letter-spacing:-.02em}
.pick span{color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--tx);color:#000;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}

  <div class="top-ic"><a href="#/stats" id="icstats" aria-label="Mes stats">◔</a><a href="#/reglages" id="icset" aria-label="Réglages et compte">⚙<i class="sdot" id="sdot"></i></a></div>

<script>window.COLLEC_CONFIG=window.COLLEC_CONFIG||{};</script>
<script src="config.js"></script>
<script>
/* =========================================================
   CONFIG — mets plutôt tes clés dans un fichier config.js à côté
   de ce fichier (voir Réglages > Synchro), comme ça les mises à jour
   du site ne les effacent pas.
   ========================================================= */
const CONFIG={
  TMDB_KEY:"",          // films et séries (clé API TMDB)
  RAWG_KEY:"",          // jeux vidéo (optionnel)
  GOOGLE_BOOKS_KEY:"",  // optionnel
  SUPABASE_URL:"",      // synchro entre appareils
  SUPABASE_ANON_KEY:""
};
const LS="collec2";
let LOCALCFG={};try{LOCALCFG=JSON.parse(localStorage.getItem(LS+"-cfg"))||{}}catch(e){}
if(location.hash.startsWith("#cfg=")){try{const c=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(5)))));LOCALCFG={...LOCALCFG,...c};localStorage.setItem(LS+"-cfg",JSON.stringify(LOCALCFG))}catch(e){}history.replaceState(null,"",location.pathname+"#/reglages")}
const cfg=k=>String(LOCALCFG[k]||(window.COLLEC_CONFIG||{})[k]||CONFIG[k]||"").trim();

/* ---------- types ---------- */
const TYPES={
  film:{l:"Film",todo:"À voir",done:"Vu",prog:null},
  serie:{l:"Série",todo:"À voir",done:"Vue",prog:["Saison","Épisode"]},
  anime:{l:"Animé",todo:"À voir",done:"Vu",prog:["Saison","Épisode"]},
  cartoon:{l:"Dessin animé",todo:"À voir",done:"Vu",prog:["Saison","Épisode"]},
  doc:{l:"Documentaire",todo:"À voir",done:"Vu",prog:["Saison","Épisode"]},
  livre:{l:"Livre",todo:"À lire",done:"Lu",prog:["Page",null]},
  manga:{l:"Manga",todo:"À lire",done:"Lu",prog:["Tome","Chapitre"]},
  manhwa:{l:"Manhwa / webtoon",todo:"À lire",done:"Lu",prog:["Chapitre",null]},
  bd:{l:"BD",todo:"À lire",done:"Lue",prog:["Tome",null]},
  comics:{l:"Comics",todo:"À lire",done:"Lu",prog:["Tome","Numéro"]},
  jeu:{l:"Jeu vidéo",todo:"À jouer",done:"Fini",prog:["Progression (%)",null]}
};
const isRead=t=>["livre","manga","manhwa","bd","comics"].includes(t);
const STAT=["todo","doing","done","drop"];
function statLabel(s,type){const T=TYPES[type]||TYPES.film;return s==="todo"?T.todo:s==="doing"?"En cours":s==="done"?T.done:s==="drop"?"Abandonné":""}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"'");
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const enc=encodeURIComponent;
const MONTHS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtDate=d=>{if(!d)return"";const [y,m,j]=d.split("-");return `${+j} ${MONTHS[+m-1]} ${y}`};
const stripHtml=s=>{const t=document.createElement("textarea");t.innerHTML=String(s||"").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"");return t.value.replace(/\n{3,}/g,"\n\n").trim()};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2400)}
function modal(html){const m=$("#modal");m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false}
function closeModal(){const m=$("#modal");m.hidden=true;m.innerHTML=""}

/* ---------- registry & state ---------- */
const W={};
function reg(w){if(!w||!w.k)return w;if(S.items[w.k])return W[w.k]=S.items[w.k];if(!W[w.k])W[w.k]=w;else if(!W[w.k].img&&w.img)W[w.k].img=w.img;return W[w.k]}
function defFolders(){return[
  {id:"fav",name:"Mes coups de cœur",cat:"all",cover:{k:"p",v:3},desc:"Tout ce que j’ai adoré, classé par ordre de préférence.",sort:"manual",keys:[]},
  {id:"wish",name:"Envies",cat:"all",cover:{k:"p",v:6},desc:"Ce que je veux voir, lire ou jouer.",sort:"manual",keys:[]}
]}
function fix(s){s=s||{};s.v=2;s.items=s.items||{};s.folders=s.folders||[];s.tiers=s.tiers||[];for(const d of defFolders().reverse())if(!s.folders.find(f=>f.id===d.id))s.folders.unshift(d);s.goal=s.goal||24;s.t=s.t||0;return s}
let S;try{S=fix(JSON.parse(localStorage.getItem(LS)))}catch(e){S=fix(null)}
for(const [k,i] of Object.entries(S.items))W[k]=i;
let saveTimer;

/* ---------- Supabase sync ---------- */
let SB=null,SESSION=null,syncState="local";
function setSync(s){syncState=s;const d=$("#sdot");if(d)d.className="sdot "+(s==="ok"?"ok":s==="err"?"err":"")}
async function initSB(){
  const url=cfg("SUPABASE_URL"),key=cfg("SUPABASE_ANON_KEY");
  if(!url||!key||!window.supabase)return;
  try{SB=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}})}catch(e){SB=null;setSync("err");return}
  const {data}=await SB.auth.getSession();SESSION=data.session;
  SB.auth.onAuthStateChange((ev,s)=>{const was=!!SESSION;SESSION=s;if(s&&!was)pull();if(!s)setSync("local");if(route()[0]==="reglages")render()});
  if(SESSION)pull();
}
let syncMsg="";
function mergeStates(a,b){
  const newer=(a.t||0)>=(b.t||0)?a:b,older=newer===a?b:a;
  const out=JSON.parse(JSON.stringify(newer));
  out.del={...(older.del||{}),...(newer.del||{})};out.delF={...(older.delF||{}),...(newer.delF||{})};out.delT={...(older.delT||{}),...(newer.delT||{})};
  out.items=out.items||{};
  for(const [k,v] of Object.entries(older.items||{}))if(!out.items[k])out.items[k]=v;
  for(const [k,t] of Object.entries(out.del))if(out.items[k]&&(out.items[k].added||0)<t)delete out.items[k];
  out.folders=out.folders||[];
  for(const f of older.folders||[]){if(out.delF[f.id])continue;const g=out.folders.find(x=>x.id===f.id);if(!g)out.folders.push(f);else for(const k of f.keys)if(!g.keys.includes(k))g.keys.push(k)}
  out.folders=out.folders.filter(f=>!out.delF[f.id]);
  out.tiers=out.tiers||[];for(const t of older.tiers||[])if(!out.delT[t.id]&&!out.tiers.find(x=>x.id===t.id))out.tiers.push(t);
  out.tiers=out.tiers.filter(t=>!out.delT[t.id]);
  out.myStk=[...new Set([...(newer.myStk||[]),...(older.myStk||[])])];
  return fix(out);
}
async function pull(){
  if(!SB||!SESSION)return;
  const {data,error}=await SB.from("collec").select("data").eq("user_id",SESSION.user.id).maybeSingle();
  if(error){console.warn(error);syncMsg=error.message;setSync("err");if(route()[0]==="reglages")render();return}
  if(!data||!data.data){syncMsg="";await push();return}
  const remote=data.data;const merged=mergeStates(S,remote);
  const changedLocal=JSON.stringify(merged.items)!==JSON.stringify(S.items)||JSON.stringify(merged.folders)!==JSON.stringify(S.folders)||JSON.stringify(merged.tiers)!==JSON.stringify(S.tiers);
  const changedRemote=JSON.stringify(merged.items)!==JSON.stringify(remote.items||{})||JSON.stringify(merged.folders)!==JSON.stringify(remote.folders||[])||JSON.stringify(merged.tiers)!==JSON.stringify(remote.tiers||[]);
  S=merged;for(const [k,i] of Object.entries(S.items))W[k]=i;persist();syncMsg="";
  if(changedRemote){S.t=Date.now();persist();await push()}else setSync("ok");
  if(changedLocal)render();
}
let pushing=false,pushAgain=false;
async function push(){
  if(!SB||!SESSION)return;if(pushing){pushAgain=true;return}pushing=true;
  const {error}=await SB.from("collec").upsert({user_id:SESSION.user.id,data:S,updated_at:new Date().toISOString()});
  setSync(error?"err":"ok");syncMsg=error?error.message:"";if(error)console.warn(error);
  pushing=false;if(pushAgain){pushAgain=false;push()}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});

function src(ref){if(!ref)return"";if(ref.startsWith("ls:")){try{return localStorage.getItem(LS+"-img-"+ref.slice(3))||""}catch(e){return""}}return ref}
function downscale(file,max,type="image/jpeg"){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),type,.85)};img.onerror=rej;img.src=URL.createObjectURL(file)})}
const toDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function storeBlob(blob){
  if(SB&&SESSION){
    const ext=blob.type==="image/png"?"png":"jpg";const path=`${SESSION.user.id}/${uid()}.${ext}`;
    const {error}=await SB.storage.from("collec").upload(path,blob,{contentType:blob.type});
    if(!error)return SB.storage.from("collec").getPublicUrl(path).data.publicUrl;
    console.warn(error);
  }
  const id=uid();try{localStorage.setItem(LS+"-img-"+id,await toDataURL(blob));return"ls:"+id}catch(e){toast("Image trop lourde pour être gardée");return null}
}
function dropImage(ref){
  if(!ref)return;
  if(ref.startsWith("ls:")){try{localStorage.removeItem(LS+"-img-"+ref.slice(3))}catch(e){}return}
  if(SB&&SESSION&&ref.includes("/collec/")){const p=ref.split("/collec/")[1].split("?")[0];SB.storage.from("collec").remove([p]).catch(()=>{})}
}

/* ---------- cache ---------- */
const MEM={};
async function cached(key,hours,fn){
  if(MEM[key])return MEM[key];
  try{const c=JSON.parse(localStorage.getItem(LS+"c:"+key));if(c&&Date.now()-c.t<hours*36e5){MEM[key]=c.v;return c.v}}catch(e){}
  const v=await fn();MEM[key]=v;
  const str=JSON.stringify({t:Date.now(),v});
  try{localStorage.setItem(LS+"c:"+key,str)}catch(e){Object.keys(localStorage).filter(k=>k.startsWith(LS+"c:")).forEach(k=>localStorage.removeItem(k));try{localStorage.setItem(LS+"c:"+key,str)}catch(e2){}}
  return v;
}

const TG={28:"Action",12:"Aventure",16:"Animation",35:"Comédie",80:"Crime",99:"Documentaire",18:"Drame",10751:"Familial",14:"Fantastique",36:"Histoire",27:"Horreur",10402:"Musique",9648:"Mystère",10749:"Romance",878:"Science-fiction",53:"Thriller",10752:"Guerre",37:"Western",10759:"Action et aventure",10762:"Enfants",10764:"Téléréalité",10765:"SF et fantastique",10766:"Feuilleton",10768:"Guerre et politique",10770:"Téléfilm"};
const TIMG="https://image.tmdb.org/t/p/";
async function tmdb(path,params={},lang="fr-FR"){
  const key=cfg("TMDB_KEY");if(!key)throw new Error("nokey");
  const u=new URL("https://api.themoviedb.org/3"+path);u.searchParams.set("language",lang);
  for(const [k,v] of Object.entries(params))u.searchParams.set(k,v);
  const h={accept:"application/json"};if(key.length>40)h.Authorization="Bearer "+key;else u.searchParams.set("api_key",key);
  return getJSON(u,{headers:h});

function fromTmdb(x,kind){
  const tv=kind==="tv"||x.media_type==="tv";const g=x.genre_ids||(x.genres||[]).map(z=>z.id);const oc=x.origin_country||[];
  const type=tv?(g.includes(16)?(oc.includes("JP")?"anime":"cartoon"):g.includes(99)?"doc":"serie"):(g.includes(99)?"doc":"film");
  return reg({k:`tmdb-${tv?"tv":"movie"}:${x.id}`,t:x.title||x.name,y:String(x.release_date||x.first_air_date||"").slice(0,4),c:"",type,img:x.poster_path?TIMG+"w342"+x.poster_path:"",g:TG[g.find(i=>i!==16&&i!==18)||g[0]]||"",src:"tmdb"});
}
async function tmdbList(path,params={},pages=1){
  const kind=path.includes("/tv")?"tv":"movie";let out=[];
  for(let p=1;p<=pages;p++){const j=await tmdb(path,{...params,page:p});out=out.concat(j.results||[])}
  return out.filter(x=>x.poster_path).map(x=>fromTmdb(x,kind));
}

const AF=`id type format countryOfOrigin title{romaji english} coverImage{large} startDate{year} genres staff(perPage:2,sort:RELEVANCE){nodes{name{full}}}`;
async function ani(query,variables){

const OLC=id=>`https://covers.openlibrary.org/b/id/${id}-M.jpg`;
function gbItem(v){

  return reg({k:"gb:"+v.id,t:i.title+(i.subtitle&&i.subtitle.length<40?" : "+i.subtitle:""),y:String(i.publishedDate||"").slice(0,4),c:(i.authors||[]).join(", "),type,img,g:(i.categories||[])[0]||"",src:"gb"});

async function resolveBook([t,a,type]){
  const w=await cached("rb2:"+slug(t+"|"+a),24*30,async()=>{
    let r=null;
    try{const j=await getJSON(`https://openlibrary.org/search.json?q=${enc(t+" "+(a||""))}&limit=1&fields=key,title,author_name,first_publish_year,cover_i`);const d=(j.docs||[])[0];if(d&&d.cover_i)r={k:"ol:"+d.key,t,y:String(d.first_publish_year||""),c:a||(d.author_name||[])[0]||"",type,img:OLC(d.cover_i),g:"",src:"ol"}}catch(e){}

    return r||{k:"man:"+type+":"+slug(t),t,c:a||"",type,img:"",g:"",src:"man"};

const HUES=[268,282,296,312,328,252,238,206,344];
function genCover(w,cls=""){const h=hash(w.t+w.type),hue=HUES[h%HUES.length],v=h%3;return `<div class="cov gen v${v} ${cls}" style="--h:${hue}" aria-hidden="true"><span class="cov-l">${esc([...String(w.t)][0]||"?")}</span><span class="cov-c">${esc(w.c||TYPES[w.type].l)}</span><span class="cov-t">${esc(w.t)}</span></div>`}
function imgOf(w){const it=S.items[w.k];return it&&it.cover?src(it.cover):(it&&it.img)||w.img||""}
function coverHTML(w,cls=""){const u=imgOf(w);if(!u)return genCover(w,cls);return `<div class="cov ${cls}"><img class="ci" data-k="${esc(w.k)}" src="${esc(u)}" alt="${esc(w.t)}" loading="lazy" decoding="async"></div>`}
document.addEventListener("error",e=>{const t=e.target;if(t.tagName==="IMG"&&t.classList.contains("ci")){const w=W[t.dataset.k];const p=t.parentElement;if(w&&p)p.outerHTML=genCover(w,p.className.replace("cov","").trim())}},true);
function card(w,rank){
  const k=w.k,it=S.items[k];
  const b=it&&it.status==="done"?`<i class="badge done" aria-label="Terminé">✓</i>`:inFolder("fav",k)?`<i class="badge" aria-label="Coup de cœur">♥</i>`:"";
  return `<button class="card" data-k="${esc(k)}">${rank?`<b class="rank">${rank}</b>`:""}${coverHTML(w)}${b}<span class="card-t">${esc(w.t)}</span><span class="card-s">${esc([TYPES[w.type].l,w.y].filter(Boolean).join(", "))}</span></button>`;
}
const arrows=`<div class="arrows"><button class="arr" data-act="scroll" data-d="-1" aria-label="Défiler vers la gauche">‹</button><button class="arr" data-act="scroll" data-d="1" aria-label="Défiler vers la droite">›</button></div>`;
function rowHTML(title,list,opt={}){return `<section class="row ${opt.rank?"ranked":""}"><div class="row-h"><h3>${esc(title)}</h3>${arrows}</div><div class="strip">${list.map((w,i)=>card(w,opt.rank?i+1:0)).join("")}</div></section>`}
function lazyRow(id,title,rank){return `<section class="row ${rank?"ranked":""}" data-row="${id}" data-rank="${rank?1:""}"><div class="row-h"><h3>${esc(title)}</h3>${arrows}</div><div class="strip">${'<div class="sk"></div>'.repeat(8)}</div></section>`}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);fillRow(e.target)}}),{rootMargin:"300px"});
function observeRows(){$$("[data-row]").forEach(el=>io.observe(el))}
async function fillRow(el){
  const id=el.dataset.row,def=ROWFN[id];if(!def)return;const strip=el.querySelector(".strip");
  try{
    const list=(await cached("row:"+id,6,def.fn)).map(w=>reg(w));
    if(!list.length){strip.innerHTML=`<p class="rowmsg">Rien pour l’instant ici.</p>`;return}
    if(def.cult){list.forEach(w=>{w.cult=1;if(S.items[w.k])S.items[w.k].cult=1});strip.innerHTML=list.map((w,i)=>ccard(w,def.cult[i])).join("")||`<p class="rowmsg">Rien à ce niveau dans ce thème.</p>`;return}
    strip.innerHTML=list.map((w,i)=>card(w,el.dataset.rank?i+1:0)).join("");
  }catch(e){console.warn(id,e);strip.innerHTML=`<p class="rowmsg">Impossible de charger cette ligne. <button class="link" data-act="retryrow">Réessayer</button></p>`}
}

  const r=SEARCH[q]&&SEARCH[q][id];
  if(id==="films"&&!cfg("TMDB_KEY"))return keyHint("tmdb");

function afterSearch(q){

  if(cfg("TMDB_KEY"))run("films",tmdb("/search/multi",{query:q,include_adult:false}).then(j=>(j.results||[]).filter(x=>(x.media_type==="movie"||x.media_type==="tv")&&x.poster_path).map(x=>fromTmdb(x))));
  run("livres",gbooks(q,24).catch(async()=>{const j=await getJSON(`https://openlibrary.org/search.json?q=${enc(q)}&limit=24&fields=key,title,author_name,first_publish_year,cover_i`);return (j.docs||[]).map(d=>fromOL(d))}));
  run("mangas",aniList({q,s:["SEARCH_MATCH"]}));
  if(cfg("RAWG_KEY"))run("jeux",rawg("search="+enc(q)));
}

let fFilter="all",fOpen=null;const fCollapsed=new Set();
const GROUPS=["doing","todo","none","done","drop"];
function groupLabel(g,cat){const T=TYPES[cat];const pl=x=>x.endsWith("s")?x:x+"s";
  if(g==="doing")return"En cours";if(g==="todo")return T?T.todo:"À voir / à lire";if(g==="none")return"Pas encore classés";
  if(g==="done")return T?pl(T.done.replace(/e$/,"")):"Terminés";return"Abandonnés"}
function sortList(list,s){
  if(s==="rating")list.sort((a,b)=>(b.it.rating||0)-(a.it.rating||0));
  else if(s==="date")list.sort((a,b)=>(b.it.end||"").localeCompare(a.it.end||""));
  else if(s==="title")list.sort((a,b)=>a.it.t.localeCompare(b.it.t,"fr"));
  else if(s==="added")list.sort((a,b)=>(b.it.added||0)-(a.it.added||0));
  return list;

function lrowHTML(f,x,n,manual,prevK,nextK){const it=x.it,done=it.status==="done";
  return `<div class="lrow">${manual?`<span class="lpos">${n+1}</span>`:""}<button class="lchk ${done?"on":""}" data-act="toggledone" data-k="${esc(x.k)}" aria-label="${done?"Marquer comme pas fini":"Marquer comme fini"}">✓</button><a class="lmain" href="#/item/${enc(x.k)}">${coverHTML(it)}<div><b>${esc(it.t)}</b><span>${esc([TYPES[it.type].l,it.y].filter(Boolean).join(", "))}</span>${it.status?`<span class="st">${statLabel(it.status,it.type)}${done&&it.end?" le "+fmtDate(it.end):""}</span>`:""}</div></a>${ministars(it.rating)}${manual?`<div class="lmove"><button data-act="mv" data-f="${esc(f.id)}" data-k="${esc(x.k)}" data-o="${esc(prevK||"")}" ${prevK?"":"disabled"} aria-label="Monter">↑</button><button data-act="mv" data-f="${esc(f.id)}" data-k="${esc(x.k)}" data-o="${esc(nextK||"")}" ${nextK?"":"disabled"} aria-label="Descendre">↓</button></div>`:""}<button class="lx" data-act="rmfrom" data-f="${esc(f.id)}" data-k="${esc(x.k)}" aria-label="Retirer du dossier">×</button></div>`}
function listHTML(f,list,manual){return `<div class="list">${list.map((x,n)=>lrowHTML(f,x,n,manual,list[n-1]&&list[n-1].k,list[n+1]&&list[n+1].k)).join("")}</div>`}
function vFolder(id){
  const f=folder(id);if(!f)return `<div class="page-h"><h1>Dossier introuvable</h1></div><a class="btn" href="#/folders">Voir mes dossiers</a>`;
  if(fOpen!==id){fOpen=id;fFilter="all"}
  const all=f.keys.filter(k=>S.items[k]).map((k,i)=>({k,i,it:S.items[k]}));
  const by={};GROUPS.forEach(g=>by[g]=all.filter(x=>(x.it.status||"none")===g));
  const total=all.length,doneN=by.done.length,s=f.sort||"manual",manual=s==="manual";
  const tabs=[["all","Tout",total],...GROUPS.map(g=>[g,groupLabel(g,f.cat),by[g].length]).filter(([g,l,n])=>n||g==="doing"||g==="todo"||g==="done")];
  if(!tabs.find(t=>t[0]===fFilter))fFilter="all";
  let body;
  if(!total)body=`<div class="empty">Dossier vide. Cherche une œuvre ou appuie longuement sur une couverture pour l’ajouter ici.</div>`;
  else if(fFilter==="all")body=GROUPS.filter(g=>by[g].length).map(g=>{const c=fCollapsed.has(f.id+g);return `<section class="grp"><button class="gh" data-act="fcol" data-g="${f.id+g}" aria-expanded="${!c}"><span class="gchev">${c?"▸":"▾"}</span>${esc(groupLabel(g,f.cat))}<b>${by[g].length}</b></button>${c?"":listHTML(f,sortList(by[g],s),manual)}</section>`}).join("");
  else body=by[fFilter].length?listHTML(f,sortList(by[fFilter],s),manual):`<div class="empty">Rien dans « ${esc(groupLabel(fFilter,f.cat))} » pour l’instant.</div>`;
  return `<div class="fhead">${folderCover(f)}<div><h1>${esc(f.name)}</h1>${f.desc?`<p>${esc(f.desc)}</p>`:""}<p class="fine">${total} œuvre${total>1?"s":""}, dont ${doneN} terminée${doneN>1?"s":""}</p><div class="acts"><button class="btn sm ghost" data-act="editfolder" data-id="${esc(f.id)}">Modifier</button>${f.id!=="fav"&&f.id!=="wish"?`<button class="btn sm danger" data-act="delfolder" data-id="${esc(f.id)}">Supprimer</button>`:""}</div></div></div>
  <div class="ftabbar" role="tablist">${tabs.map(([v,l,n])=>`<button role="tab" aria-selected="${fFilter===v}" class="${fFilter===v?"on":""}" data-act="ffilter" data-v="${v}">${esc(l)}<b>${n}</b></button>`).join("")}</div>
  <div class="tools" style="justify-content:flex-end"><select data-sort="${esc(f.id)}" aria-label="Trier">${[["manual","Mon ordre"],["rating","Mieux notés"],["date","Terminés récemment"],["added","Ajoutés récemment"],["title","Titre A-Z"]].map(([v,l])=>`<option value="${v}" ${s===v?"selected":""}>${l}</option>`).join("")}</select></div>
  ${body}`;
}

let RECOS=null,recoBusy=false,recoErr="";
function vForYou(){
  return `<div class="page-h"><h1>Pour toi</h1></div>
  <section class="panel"><h2>Je sais pas quoi regarder</h2><p>Je tire au hasard une œuvre dans tes envies et dans ce que t’as marqué « à voir » ou « à lire ».</p><button class="btn" data-act="random">Tirer au sort</button></section>
  <section class="panel"><h2>Recos perso</h2><p>Les œuvres les plus recommandées par les gens qui ont aimé tes coups de cœur et tes 4 ou 5 étoiles.</p><button class="btn" data-act="recos" ${recoBusy?"disabled":""}>${RECOS?"Actualiser":"Trouver des recos"}</button><div id="recos">${recosHTML()}</div></section>`;
}
function recosHTML(){
  if(recoBusy)return `<p class="loading" style="margin-top:14px">Je regarde tes goûts…</p>`;
  if(recoErr)return `<p class="fine" style="margin-top:14px">${esc(recoErr)}</p>`;
  if(!RECOS)return"";
  return `<div class="grid" style="margin-top:16px">${RECOS.map(r=>`<div class="reco">${card(r.w)}<p>Parce que t’as aimé ${esc(r.from.slice(0,2).join(" et "))}</p></div>`).join("")}</div>`;
}
async function getRecos(){
  if(recoBusy)return;
  const liked=Object.values(S.items).filter(i=>i.rating>=4||inFolder("fav",i.k)).sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,10);
  if(!liked.length){recoErr="Note quelques œuvres 4 ou 5 étoiles, ou ajoute des coups de cœur, et je pourrai te proposer des trucs.";render();return}
  recoBusy=true;recoErr="";render();
  const score={};
  for(const it of liked){try{const d=await getDetails(it);for(const r of (d&&d.recos)||[]){if(S.items[r.k])continue;const s=score[r.k]||(score[r.k]={w:reg(r),n:0,from:[]});s.n++;if(!s.from.includes(it.t))s.from.push(it.t)}}catch(e){}}
  RECOS=Object.values(score).sort((a,b)=>b.n-a.n).slice(0,18);
  if(!RECOS.length)recoErr="Pas trouvé de recos pour l’instant, réessaie quand t’auras noté plus d’œuvres.";
  recoBusy=false;if(route()[0]==="pour-toi")render();
}

/* ---------- stats ---------- */
function vStats(){
  const all=Object.values(S.items),y=String(new Date().getFullYear());
  const done=all.filter(i=>i.status==="done"),doneY=done.filter(i=>(i.end||"").startsWith(y));
  const rated=all.filter(i=>i.rating),avg=rated.length?(rated.reduce((a,i)=>a+i.rating,0)/rated.length).toFixed(1).replace(".",","):"–";
  const byType={};for(const i of done)byType[i.type]=(byType[i.type]||0)+1;const maxT=Math.max(1,...Object.values(byType));
  const gen={};for(const i of done){const g=i.g||TYPES[i.type].l;gen[g]=(gen[g]||0)+1}
  const topG=Object.entries(gen).sort((a,b)=>b[1]-a[1]).slice(0,6),maxG=Math.max(1,...topG.map(x=>x[1]));
  const months=Array(12).fill(0);for(const i of doneY)months[+i.end.slice(5,7)-1]++;const maxM=Math.max(1,...months);
  const pct=Math.min(100,Math.round(doneY.length/S.goal*100));
  const best=all.filter(i=>i.rating>=4).sort((a,b)=>b.rating-a.rating).slice(0,14);
  return `<div class="page-h"><h1>Mes stats</h1></div>
  <section class="panel"><h2>Objectif ${y}</h2><div class="goal"><i style="width:${pct}%"></i></div><p class="fine" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0">${doneY.length} terminé${doneY.length>1?"s":""} sur <input type="number" min="1" class="inp" style="width:80px;padding:6px 10px" data-goal value="${S.goal}" aria-label="Objectif de l’année"> cette année</p></section>
  <div class="kpis"><div class="kpi"><b>${done.length}</b><span>terminés au total</span></div><div class="kpi"><b>${all.filter(i=>i.status==="doing").length}</b><span>en cours</span></div><div class="kpi"><b>${all.filter(i=>i.status==="todo").length}</b><span>dans la pile à faire</span></div><div class="kpi"><b>${avg}</b><span>note moyenne</span></div><div class="kpi"><b>${all.filter(i=>i.cult&&i.status==="done").length}</b><span>œuvres culture G terminées</span></div></div>
  <div class="two"><section class="panel"><h2>Par type</h2><p>Ce que t’as terminé.</p>${Object.keys(byType).length?`<div class="bars">${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<div class="bar"><span>${TYPES[t].l}</span><div><i style="width:${n/maxT*100}%"></i></div><b>${n}</b></div>`).join("")}</div>`:`<p class="fine">Marque des œuvres comme terminées pour voir ça.</p>`}</section>
  <section class="panel"><h2>Genres préférés</h2><p>D’après ce que t’as fini.</p>${topG.length?`<div class="bars">${topG.map(([g,n])=>`<div class="bar"><span>${esc(g)}</span><div><i style="width:${n/maxG*100}%;background:var(--pk)"></i></div><b>${n}</b></div>`).join("")}</div>`:`<p class="fine">Pas encore assez de données.</p>`}</section></div>
  <section class="panel"><h2>Mois par mois</h2><p>Œuvres terminées en ${y}.</p><div class="months">${months.map((n,i)=>`<div><span>${n||""}</span><i style="height:${n/maxM*100}%"></i>${"JFMAMJJASOND"[i]}</div>`).join("")}</div></section>
  ${best.length?rowHTML("Mieux notés",best):""}`;
}

create policy "img ajouter" on storage.objects for insert to authenticated with check (bucket_id = 'collec' and (storage.foldername(name))[1] = auth.uid()::text);

  if(kind==="import"){try{const d=JSON.parse(await files[0].text());if(!d.S||!d.S.items)throw 0;if(!confirm("Remplacer toutes tes données actuelles par cette copie ?"))return;for(const [k,v] of Object.entries(d.imgs||{}))try{localStorage.setItem(k,v)}catch(x){}S=fix(d.S);S.t=Date.now();for(const [k,i] of Object.entries(S.items))W[k]=i;save();toast("Copie restaurée");render()}catch(x){toast("Ce fichier n’est pas une copie de Collec")}return}
  toast("Envoi de l’image…");
  if(kind==="cover"){const ref=await storeBlob(await downscale(files[0],700));if(ref){const it=ensure(curK());if(it.cover)dropImage(it.cover);it.cover=ref;save();render();toast("Couverture changée")}}
  if(kind==="fcover"){syncFD();const ref=await storeBlob(await downscale(files[0],800));if(ref){FD.cover={k:"img",v:ref};drawFolderEditor()}}
  if(kind==="mood"){const f=bOf(el.closest("[data-bid]")?el:el);const bid=el.closest("[data-bid]").dataset.bid;for(const file of files.slice(0,9)){const ref=await storeBlob(await downscale(file,700));const g=jFind(curK(),bid);if(ref&&g){(g.b.photos=g.b.photos||[]).push(ref)}}save();render()}
  if(kind==="mystk"){const ref=await storeBlob(await downscale(files[0],500,"image/png"));if(ref){S.myStk=S.myStk||[];S.myStk.push(ref);save();openStickers(curK())}}
});

  if(e.key==="Escape"&&!$("#modal").hidden){closeModal();render()}
  const el=e.target;
  if(e.key==="Enter"&&el.hasAttribute("data-qin")){e.preventDefault();ACT.jaddq(el.nextElementSibling)}
  if(e.key==="Enter"&&el.dataset.enter==="tq"){e.preventDefault();const q=el.value.trim();tAddRes=[];openTierAdd(el.dataset.id,q);setTimeout(()=>{const n=$("#tq");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},0)}
});
$("#sf").addEventListener("submit",e=>{e.preventDefault();const q=$("#q").value.trim();if(q){$("#q").blur();go("search",q)}});
